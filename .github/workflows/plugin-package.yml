name: plugin-package

# Builds the Codex / Claude Code plugin bundle on every supported host
# class, smoke-tests it against the real binary, and attaches the
# tarballs to the GitHub Release when a `v*` tag is pushed. The version
# inside the package is stamped from the workspace Cargo.toml by
# scripts/plugin/package-made-plugin.sh — on a tag, tag and workspace
# version must agree or the job fails.

on:
  pull_request:
    branches:
      - main
    # ready_for_review is the handover moment from the dev loop to the
    # full gates; without it this workflow would wait for the next push.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".agents/plugins/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - "plugins/made/**"
      - "scripts/plugin/**"
      - "scripts/release/**"
      - "scripts/release.sh"
      - "scripts/ci/release-preflight.py"
      - "scripts/ci/made-marketplace-contract.py"
      - "scripts/ci/made-plugin-bootstrap.sh"
      - "scripts/ci/made-plugin-bootstrap-windows.ps1"
      - "scripts/ci/made-plugin-smoke.sh"
      - "scripts/ci/package-made-console.sh"
      - "scripts/ci/install-protoc.sh"
      - "tests/plugin/**"
      - "crates/made-mcp/**"
      - "crates/made-client/**"
      - "crates/made-console/**"
      - "crates/made-proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      # …but not its prose. A README cannot change the binary the bundle
      # ships, and waking four hosts for one is the opposite of a fast
      # loop. The exclusion is deliberately narrow: the markdown under
      # plugins/made/** — the skills and commands — *is* bundle content
      # and still wakes the matrix.
      - "!crates/made-mcp/**/*.md"
      - ".github/workflows/plugin-package.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_ref: ${{ steps.release.outputs.release_ref }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Checkout release identity
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Verify one release identity before packaging
        id: release
        shell: bash
        run: |
          python3 scripts/ci/release-preflight.py --self-test
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            mode=--require-release-tag
          else
            mode=--allow-unpublished-tag
          fi
          python3 scripts/ci/release-preflight.py "${mode}" \
            --github-output "${GITHUB_OUTPUT}" \
            --plugin-assets dist/release/plugin-assets.txt

      - name: Preserve the exact expected release inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-preflight
          path: dist/release/plugin-assets.txt
          if-no-files-found: error

  # A draft pull request is development mode: dev-loop.yml answers it, and
  # this four-host packaging matrix stands down until the pull request is
  # marked ready for review. Tag and main pushes are unaffected.
  #
  # `contents: read`: every step below runs code the pull request wrote —
  # the marketplace contract, the plugin smoke, the two bootstrap scripts
  # and the packager — so a write token here is a write token those scripts
  # can spend. The release upload is the one step that needs to write, and
  # it has moved to its own tag-gated job.
  package:
    needs: [release-preflight]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: macos-latest
            label: macos-arm64
          - os: windows-latest
            label: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1

      - name: Install protoc
        shell: bash
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          shared-key: plugin-package

      - name: Verify the co-located marketplace contract
        shell: bash
        run: |
          python3 scripts/ci/made-marketplace-contract.py --self-test
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            python3 scripts/ci/made-marketplace-contract.py --require-release-tag
          else
            python3 scripts/ci/made-marketplace-contract.py --allow-unpublished-tag
          fi

      - name: Smoke-test the plugin bundle
        run: bash scripts/ci/made-plugin-smoke.sh

      - name: Prove clean checksummed setup without Cargo
        run: bash scripts/ci/made-plugin-bootstrap.sh

      - name: Prove native Windows checksummed setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/made-plugin-bootstrap-windows.ps1

      - name: Package the plugin bundle
        run: bash scripts/plugin/package-made-plugin.sh

      - name: Build and smoke-test the operator console candidate
        shell: bash
        run: bash scripts/ci/package-made-console.sh

      - name: Upload package as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: made-plugin-${{ matrix.label }}
          path: dist/plugin/*
          if-no-files-found: error

      - name: Upload console candidate as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: made-console-${{ matrix.label }}
          path: dist/console/*
          if-no-files-found: error

  # The one job that writes to the repository, and the only one that runs
  # no pull-request code: it downloads what the four hosts built and
  # attaches it to the release. Tag-gated, so it does not exist on a pull
  # request at all, and it waits for all four hosts — a release that is
  # missing a platform is worse than a release that is late.
  #
  # No checkout: `gh` reads the repository from GH_REPO, and there is no
  # reason to put a working tree next to a write token.
  release-upload:
    needs: [release-preflight, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Collect the preflight release inventory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-preflight
          path: dist/release

      - name: Collect the bundles the matrix packaged
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: made-plugin-*
          merge-multiple: true
          path: dist/plugin

      - name: Attach the packages to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_PRERELEASE: ${{ needs.release-preflight.outputs.prerelease }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          scratch="$(mktemp -d)"
          trap 'rm -rf "${scratch}"' EXIT

          find dist/plugin -maxdepth 1 -type f -printf '%f\n' \
            | LC_ALL=C sort > "${scratch}/local.txt"
          if ! cmp -s dist/release/plugin-assets.txt "${scratch}/local.txt"; then
            echo "error: packaged assets differ from the preflight inventory" >&2
            diff -u dist/release/plugin-assets.txt "${scratch}/local.txt" >&2 || true
            exit 1
          fi

          if gh release view "${TAG}" --json isDraft,isPrerelease,assets \
            > "${scratch}/release.json" 2>/dev/null; then
            python3 - "${EXPECTED_PRERELEASE}" "${scratch}/release.json" <<'PY'
          import json
          import pathlib
          import sys

          expected = sys.argv[1] == "true"
          release = json.loads(pathlib.Path(sys.argv[2]).read_text())
          if release["isDraft"]:
              raise SystemExit("error: refusing to mutate an existing draft release")
          if release["isPrerelease"] is not expected:
              raise SystemExit(
                  "error: existing release prerelease flag differs from preflight"
              )
          PY
          else
            create=(release create "${TAG}" --title "${TAG}" --generate-notes --verify-tag)
            if [[ "${EXPECTED_PRERELEASE}" == "true" ]]; then
              create+=(--prerelease)
            fi
            gh "${create[@]}"
          fi

          gh release view "${TAG}" --json assets --jq '.assets[].name' \
            | LC_ALL=C sort -u > "${scratch}/remote.txt"
          if comm -13 dist/release/plugin-assets.txt "${scratch}/remote.txt" \
            | grep -q .; then
            echo "error: release contains assets outside the immutable inventory" >&2
            comm -13 dist/release/plugin-assets.txt "${scratch}/remote.txt" >&2
            exit 1
          fi

          while IFS= read -r asset; do
            if grep -Fxq "${asset}" "${scratch}/remote.txt"; then
              mkdir "${scratch}/existing"
              gh release download "${TAG}" --pattern "${asset}" \
                --dir "${scratch}/existing"
              if ! cmp -s "dist/plugin/${asset}" "${scratch}/existing/${asset}"; then
                echo "error: ${asset} already exists with different bytes" >&2
                exit 1
              fi
              rm -rf "${scratch}/existing"
            else
              gh release upload "${TAG}" "dist/plugin/${asset}"
            fi
          done < dist/release/plugin-assets.txt

          gh release view "${TAG}" --json assets --jq '.assets[].name' \
            | LC_ALL=C sort -u > "${scratch}/final.txt"
          cmp dist/release/plugin-assets.txt "${scratch}/final.txt"
