name: quality-gate

on:
  pull_request:
    branches:
      - main
    # The defaults plus ready_for_review: a draft leaving draft state is the
    # moment the full gate takes over from the dev loop, and without this
    # type the handover would wait for the next push.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # A merge to main usually lands a tree byte-identical to the pull request
  # head that was just proved green: same tree, different commit. Compiling
  # and testing it again proves nothing, and doubles the exposure to the
  # flaky parts of the matrix — every false red on a tree that was green
  # minutes earlier trains the reflex to re-run rather than read.
  #
  # The rule is "skip when this tree was already proved", never "trust the
  # pull request". A merge from an out-of-date branch, a conflict resolved in
  # the UI and a direct push all produce trees nobody tested, and each still
  # gets the full gate. So does any doubt at all.
  #
  # And "proved" is narrow: the earlier run must have run in this repository,
  # be younger than the age cap, and show *every* job of the full matrix
  # concluded `success`. A run that skipped its gates — a docs-only pull
  # request, or a push that itself skipped on an earlier proof — proves
  # nothing and is refused.
  tree-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.proof.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # The skip branch can only be observed on a real push to main, so
      # what runs on every event is the proof's own rules: a partial plan,
      # a fork, a stale run, a skipped job and a cancelled one are all
      # refused, a full plan and a push are accepted.
      - name: Prove the proof's own rules
        run: bash scripts/ci/tree-already-proved.sh --self-test
      - name: Was this tree already proved green?
        id: proof
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/tree-already-proved.sh quality-gate.yml

  # Pull requests pay only for the parts of the product they can affect. The
  # planner derives the reverse workspace dependency closure, then routes the
  # independent contracts — proto/AsyncAPI, the embedded boundaries, the
  # plugin bundle, the chart, the image, coverage, the publication dry run.
  # Unknown paths and changes to this router fail closed to the full matrix,
  # and workflow_dispatch is deliberately full.
  #
  # Draft pull requests are development mode: dev-loop.yml answers them in
  # minutes, and the full gate stands down by skipping this job — every job
  # below needs one of its outputs, so they all stand down with it. Marking
  # the pull request ready for review runs everything.
  impact:
    needs: tree-proof
    if: >-
      needs.tree-proof.outputs.skip != 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      architecture: ${{ steps.plan.outputs.architecture }}
      contract: ${{ steps.plan.outputs.contract }}
      rustfmt: ${{ steps.plan.outputs.rustfmt }}
      embedded_boundary: ${{ steps.plan.outputs.embedded_boundary }}
      embedded_sqlite: ${{ steps.plan.outputs.embedded_sqlite }}
      clippy: ${{ steps.plan.outputs.clippy }}
      test: ${{ steps.plan.outputs.test }}
      coverage: ${{ steps.plan.outputs.coverage }}
      container: ${{ steps.plan.outputs.container }}
      helm: ${{ steps.plan.outputs.helm }}
      benches: ${{ steps.plan.outputs.benches }}
      publish: ${{ steps.plan.outputs.publish }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - name: Checkout complete history for the change boundary
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Prove the routing matrix and the workflow contract
        run: |
          python3 scripts/ci/quality-gate-plan.py --self-test
          python3 scripts/ci/dev-loop-workflow-contract.py --self-test
      # --step-summary records the plan in the run: `full`, the gates it
      # selected and the event. scripts/ci/tree-already-proved.sh reads a
      # run's job conclusions rather than this record, because on a pull
      # request the planner runs from the pull request's own head; the
      # record is the same statement in the form a person reads.
      - name: Plan required gates
        id: plan
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            python3 scripts/ci/quality-gate-plan.py \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}" \
              --github-output "${GITHUB_OUTPUT}" \
              --step-summary "${GITHUB_STEP_SUMMARY}"
          else
            python3 scripts/ci/quality-gate-plan.py --full \
              --github-output "${GITHUB_OUTPUT}" \
              --step-summary "${GITHUB_STEP_SUMMARY}"
          fi

  architecture:
    needs: [impact]
    if: needs.impact.outputs.architecture == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1
      - name: Check hexagonal and DDD boundaries
        run: bash scripts/ci/architecture-gate.sh

  contract:
    needs: [impact]
    if: needs.impact.outputs.contract == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Install buf
        run: bash scripts/ci/install-buf.sh

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install AsyncAPI CLI
        run: bash scripts/ci/install-asyncapi.sh

      - name: Run contract gate
        run: bash scripts/ci/contract-gate.sh

  rustfmt:
    needs: [impact]
    if: needs.impact.outputs.rustfmt == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check domain vocabulary boundary
        run: bash scripts/ci/domain-vocabulary-boundary.sh

  embedded-boundary:
    needs: [impact]
    if: needs.impact.outputs.embedded_boundary == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1
          components: clippy
      - name: Check embedded dependency boundary
        run: bash scripts/ci/embedded-dependency-boundary.sh
      - name: Install protoc for the gRPC-only MCP build
        run: bash scripts/ci/install-protoc.sh
      - name: Lint embedded feature boundary
        run: cargo clippy -p made-embedded --all-targets --locked -- -D warnings
      # The binary forks on `embedded`, so a build without it is a distinct
      # compilation. Nothing else in CI compiled that arm, and it broke. No
      # features exercises the smallest binary; the following gRPC-only build
      # proves the published client stays independent from the embedded engine.
      - name: Lint the binary without the embedded backend
        run: cargo clippy -p made-mcp --all-targets --locked --no-default-features -- -D warnings
      - name: Lint the gRPC-only MCP client
        run: cargo clippy -p made-mcp --all-targets --locked --no-default-features --features grpc -- -D warnings

  embedded-sqlite-gates:
    needs: [impact]
    if: needs.impact.outputs.embedded_sqlite == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1
          components: clippy
      # The gate runs the whole adapter suite, which builds made-proto.
      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh
      # The canonical SQLite adapter: every store contract plus the
      # two-processes-one-store scenario.
      - name: Enforce embedded SQLite engine gates
        run: bash scripts/ci/embedded-sqlite-gates.sh
      - name: Lint embedded MCP backend
        run: cargo clippy -p made-mcp --all-targets --no-default-features --features embedded --locked -- -D warnings
      - name: Test embedded MCP stdio
        run: cargo test -p made-mcp --all-targets --no-default-features --features embedded --locked
      - name: Smoke-test Codex plugin bundle
        run: bash scripts/ci/made-plugin-smoke.sh

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [impact, contract]
    # `contract` may be routed out; a skipped need would skip this job
    # too, so the status function opens the condition explicitly.
    if: >-
      !cancelled() && needs.impact.result == 'success'
      && needs.impact.outputs.clippy == 'true'
      && needs.contract.result != 'failure'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1
          components: clippy
      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      - name: Run clippy
        # Enable every provider / transport / persistence feature
        # explicitly so feature-gated adapters (agent-anthropic,
        # agent-openai, agent-vllm, grpc, nats, sqlite, otel) are
        # linted. A feature CI never turns on is code CI never checks —
        # `otel` was outside this list while the trace bridge silently
        # stopped adopting incoming traceparents.
        # `container-tests` is deliberately excluded because the
        # separate `integration` workflow covers it with a real Docker
        # runtime.
        run: |
          cargo clippy --workspace --all-targets --locked \
            --features made-adapters/agent-anthropic \
            --features made-adapters/agent-openai \
            --features made-adapters/agent-vllm \
            --features made-adapters/sqlite \
            --features made-adapters/otel \
            --features made/otel \
            -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [impact, contract]
    # `contract` may be routed out; a skipped need would skip this job
    # too, so the status function opens the condition explicitly.
    if: >-
      !cancelled() && needs.impact.result == 'success'
      && needs.impact.outputs.test == 'true'
      && needs.contract.result != 'failure'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1
      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      - name: Run tests
        # Same feature set as clippy — exercise every provider,
        # transport and persistence module. `container-tests` stays on
        # the separate `integration` workflow (real Docker).
        run: |
          cargo test --workspace --locked \
            --features made-adapters/agent-anthropic \
            --features made-adapters/agent-openai \
            --features made-adapters/agent-vllm \
            --features made-adapters/sqlite \
            --features made-adapters/otel \
            --features made/otel

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [impact, contract]
    # `contract` may be routed out; a skipped need would skip this job
    # too, so the status function opens the condition explicitly.
    if: >-
      !cancelled() && needs.impact.result == 'success'
      && needs.impact.outputs.coverage == 'true'
      && needs.contract.result != 'failure'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7
        with:
          tool: cargo-llvm-cov
      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          shared-key: coverage
      # llvm-cov instrumentation makes every spawned binary several times
      # slower; the timing-sensitive suites scale their budgets from this.
      - name: Set instrumented timing scale
        run: echo "MADE_TEST_TIMING_SCALE=3" >> "$GITHUB_ENV"
      - name: Enforce 80 percent line coverage
        run: bash scripts/ci/rust-coverage.sh

  container-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [impact, rustfmt, clippy, test]
    if: >-
      !cancelled() && needs.impact.result == 'success'
      && needs.impact.outputs.container == 'true'
      && needs.rustfmt.result != 'failure'
      && needs.clippy.result != 'failure'
      && needs.test.result != 'failure'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Verify Docker
        run: docker version
      - name: Build container image
        run: bash scripts/ci/container-image.sh

  helm-chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [impact, contract]
    # `contract` may be routed out; a skipped need would skip this job
    # too, so the status function opens the condition explicitly.
    if: >-
      !cancelled() && needs.impact.result == 'success'
      && needs.impact.outputs.helm == 'true'
      && needs.contract.result != 'failure'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Helm
        run: bash scripts/ci/install-helm.sh
      - name: Lint Helm chart
        run: bash scripts/ci/helm-lint.sh

  benches-compile:
    # Criterion benches don't run on every PR (too noisy, wrong
    # signal/noise ratio) but they must keep compiling — a stale
    # bench silently breaks every experiment's reproducer.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [impact, contract]
    # `contract` may be routed out; a skipped need would skip this job
    # too, so the status function opens the condition explicitly.
    if: >-
      !cancelled() && needs.impact.result == 'success'
      && needs.impact.outputs.benches == 'true'
      && needs.contract.result != 'failure'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1
      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      - name: Compile benches
        run: bash scripts/ci/bench-compile.sh

  publish-dry-run:
    # Catches packaging regressions for the two crates that go to
    # crates.io (`made-mcp-proto` + `made-mcp`) before they hit
    # the publish-distribution workflow. No registry token is
    # required — `cargo publish --dry-run` and `cargo package -l`
    # only validate metadata and the file list.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [impact, contract]
    # `contract` may be routed out; a skipped need would skip this job
    # too, so the status function opens the condition explicitly.
    if: >-
      !cancelled() && needs.impact.result == 'success'
      && needs.impact.outputs.publish == 'true'
      && needs.contract.result != 'failure'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1
      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      - name: Publish dry-run
        run: bash scripts/ci/publish-dry-run.sh

  # Branch protection counts a *skipped* required job as satisfied, so the
  # stand-down above would leave a required context green on a draft head
  # commit — and a merge right after ready-for-review could sail through
  # before the real run reports. This is the one required context the
  # stand-down cannot satisfy: on a draft it fails on purpose, and on a
  # ready run (or a push to main) it succeeds only when every job above
  # either passed or was legitimately skipped.
  #
  # Protect this context on main and the draft/ready handover is enforced
  # rather than merely documented.
  gate:
    needs:
      - tree-proof
      - impact
      - architecture
      - contract
      - rustfmt
      - embedded-boundary
      - embedded-sqlite-gates
      - clippy
      - test
      - coverage
      - container-image
      - helm-chart
      - benches-compile
      - publish-dry-run
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: The full gate ran and nothing required failed
        env:
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          TREE_PROVED: ${{ needs.tree-proof.outputs.skip }}
          IMPACT: ${{ needs.impact.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [[ "${DRAFT}" == "true" ]]; then
            echo "draft: the full gate stands down; mark ready for review to run it" >&2
            exit 1
          fi
          if [[ "${TREE_PROVED}" == "true" ]]; then
            echo "tree already proved green; nothing to re-run"
            exit 0
          fi
          if [[ "${IMPACT}" != "success" ]]; then
            echo "the impact planner finished '${IMPACT}', so nothing downstream is trustworthy" >&2
            exit 1
          fi
          for result in ${RESULTS}; do
            if [[ "${result}" == "failure" || "${result}" == "cancelled" ]]; then
              echo "a required job failed or was cancelled: ${RESULTS}" >&2
              exit 1
            fi
          done
          echo "every required job passed or was skipped: ${RESULTS}"
