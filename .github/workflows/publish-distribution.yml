name: publish-distribution

# The `publish-crates` job at the bottom needs the repo secret
# `CARGO_REGISTRY_TOKEN`, set on an account with a verified email —
# crates.io rejects the upload otherwise. Without it the rest of the
# workflow (images + chart push) still does its job. Tag pushes (`v*`)
# trigger the crate publish; `workflow_dispatch` deliberately does NOT. A
# manual run is smoke-only by default and requires an explicit input to re-roll
# images, so the cold/warm measurement path has no publication side effect.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      smoke_image_source:
        description: Images used by the Compose smoke
        type: choice
        options:
          - commit-images
          - source
        default: commit-images
      cache_epoch:
        description: Cache namespace; change it for a comparable cold-cache run
        type: string
        default: v1
      publish_after_smoke:
        description: Rebuild and publish image tags after a successful manual smoke
        type: boolean
        default: false

env:
  IMAGE_NAME: ghcr.io/underpass-ai/made
  E2E_RUNNER_IMAGE_NAME: ghcr.io/underpass-ai/made-e2e-runner
  STUB_RUNTIME_IMAGE_NAME: ghcr.io/underpass-ai/made-e2e-stub-runtime
  STUB_LLM_IMAGE_NAME: ghcr.io/underpass-ai/made-e2e-stub-llm
  CHART_NAME: made
  CHART_REGISTRY: oci://ghcr.io/underpass-ai/charts
  CHART_PATH: charts/made
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_ref: ${{ steps.release.outputs.release_ref }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Checkout release identity
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Verify one release identity before publication
        id: release
        shell: bash
        run: |
          python3 scripts/ci/release-preflight.py --self-test
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            mode=--require-release-tag
          else
            mode=--allow-unpublished-tag
          fi
          python3 scripts/ci/release-preflight.py "${mode}" \
            --github-output "${GITHUB_OUTPUT}"

  # Tag-only smoke gate: resolves exact-commit images (or explicitly builds
  # them from source) and runs the full compose e2e-runner end-to-end before
  # any image / chart push.
  # Plain `main` pushes (which roll the `latest` / `main` image tags)
  # skip this on purpose. A skipped `needs` skips its dependents too, so
  # the publish jobs below have to say out loud that a skipped gate is
  # acceptable and a failed one is not.
  compose-smoke:
    needs: [release-preflight]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Docker version
        run: docker version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve image and cache identities
        id: smoke-images
        shell: bash
        env:
          REQUESTED_SOURCE: ${{ inputs.smoke_image_source }}
          REQUESTED_CACHE_EPOCH: ${{ inputs.cache_epoch }}
        run: |
          cache_epoch="${REQUESTED_CACHE_EPOCH:-v1}"
          if [[ ! "${cache_epoch}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "cache_epoch may contain only letters, digits, dot, underscore and hyphen" >&2
            exit 2
          fi

          short_sha="${GITHUB_SHA:0:7}"
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" || "${REQUESTED_SOURCE:-commit-images}" == "commit-images" ]]; then
            reuse_commit_images=true
            made_image="${IMAGE_NAME}:sha-${short_sha}"
            runner_image="${E2E_RUNNER_IMAGE_NAME}:sha-${short_sha}"
            stub_runtime_image="${STUB_RUNTIME_IMAGE_NAME}:sha-${short_sha}"
            stub_llm_image="${STUB_LLM_IMAGE_NAME}:sha-${short_sha}"
          else
            reuse_commit_images=false
            made_image="made-e2e-made:ci"
            runner_image="made-e2e-runner:ci"
            stub_runtime_image="made-e2e-stub-runtime:ci"
            stub_llm_image="made-e2e-stub-llm:ci"
          fi

          echo "cache_epoch=${cache_epoch}" >> "${GITHUB_OUTPUT}"
          echo "reuse_commit_images=${reuse_commit_images}" >> "${GITHUB_OUTPUT}"
          echo "made_image=${made_image}" >> "${GITHUB_OUTPUT}"
          echo "runner_image=${runner_image}" >> "${GITHUB_OUTPUT}"
          echo "stub_runtime_image=${stub_runtime_image}" >> "${GITHUB_OUTPUT}"
          echo "stub_llm_image=${stub_llm_image}" >> "${GITHUB_OUTPUT}"

      - name: Pull and verify exact commit images
        id: verified-images
        if: steps.smoke-images.outputs.reuse_commit_images == 'true'
        env:
          MADE_IMAGE: ${{ steps.smoke-images.outputs.made_image }}
          RUNNER_IMAGE: ${{ steps.smoke-images.outputs.runner_image }}
          STUB_RUNTIME_IMAGE: ${{ steps.smoke-images.outputs.stub_runtime_image }}
          STUB_LLM_IMAGE: ${{ steps.smoke-images.outputs.stub_llm_image }}
        run: |
          bash scripts/ci/verify-commit-image.sh \
            "${GITHUB_SHA}" \
            "${MADE_IMAGE}" \
            "${RUNNER_IMAGE}" \
            "${STUB_RUNTIME_IMAGE}" \
            "${STUB_LLM_IMAGE}"
          # Bind the execution to the verified immutable digests, not the
          # locator tags, which a registry administrator could later move.
          for image_name in made runner stub_runtime stub_llm; do
            variable_name="${image_name^^}_IMAGE"
            image="${!variable_name}"
            digest="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "${image}")"
            echo "${image_name}_image=${digest}" >> "${GITHUB_OUTPUT}"
          done

      - name: Build MADE image from source
        if: steps.smoke-images.outputs.reuse_commit_images != 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ steps.smoke-images.outputs.made_image }}
          cache-from: type=gha,scope=compose-smoke-made-${{ runner.arch }}-${{ steps.smoke-images.outputs.cache_epoch }}
          cache-to: type=gha,mode=max,scope=compose-smoke-made-${{ runner.arch }}-${{ steps.smoke-images.outputs.cache_epoch }}

      - name: Build E2E runner image from source
        if: steps.smoke-images.outputs.reuse_commit_images != 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./tests/e2e/runner.Dockerfile
          load: true
          tags: ${{ steps.smoke-images.outputs.runner_image }}
          cache-from: type=gha,scope=compose-smoke-runner-${{ runner.arch }}-${{ steps.smoke-images.outputs.cache_epoch }}
          cache-to: type=gha,mode=max,scope=compose-smoke-runner-${{ runner.arch }}-${{ steps.smoke-images.outputs.cache_epoch }}

      - name: Build runtime stub image
        if: steps.smoke-images.outputs.reuse_commit_images != 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./tests/e2e/stub-runtime.Dockerfile
          load: true
          tags: ${{ steps.smoke-images.outputs.stub_runtime_image }}
          cache-from: type=gha,scope=compose-smoke-stub-runtime-${{ runner.arch }}-${{ steps.smoke-images.outputs.cache_epoch }}
          cache-to: type=gha,mode=max,scope=compose-smoke-stub-runtime-${{ runner.arch }}-${{ steps.smoke-images.outputs.cache_epoch }}

      - name: Build LLM stub image
        if: steps.smoke-images.outputs.reuse_commit_images != 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./tests/e2e/stub-llm.Dockerfile
          load: true
          tags: ${{ steps.smoke-images.outputs.stub_llm_image }}
          cache-from: type=gha,scope=compose-smoke-stub-llm-${{ runner.arch }}-${{ steps.smoke-images.outputs.cache_epoch }}
          cache-to: type=gha,mode=max,scope=compose-smoke-stub-llm-${{ runner.arch }}-${{ steps.smoke-images.outputs.cache_epoch }}

      - name: Run compose stack smoke
        env:
          MADE_E2E_BUILD_SERVICES: ""
          MADE_E2E_MADE_IMAGE: ${{ steps.verified-images.outputs.made_image || steps.smoke-images.outputs.made_image }}
          MADE_E2E_RUNNER_IMAGE: ${{ steps.verified-images.outputs.runner_image || steps.smoke-images.outputs.runner_image }}
          MADE_E2E_STUB_RUNTIME_IMAGE: ${{ steps.verified-images.outputs.stub_runtime_image || steps.smoke-images.outputs.stub_runtime_image }}
          MADE_E2E_STUB_LLM_IMAGE: ${{ steps.verified-images.outputs.stub_llm_image || steps.smoke-images.outputs.stub_llm_image }}
        run: bash scripts/ci/e2e-compose.sh

      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compose-smoke-logs
          path: tests/e2e/compose.log
          if-no-files-found: ignore

  publish-image:
    name: publish-image (${{ matrix.name }})
    needs: [release-preflight, compose-smoke]
    if: ${{ !cancelled() && needs.release-preflight.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.compose-smoke.result) && !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.publish_after_smoke) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: made
            image: ghcr.io/underpass-ai/made
            dockerfile: ./Dockerfile
            cache_key: made
            floating_tag: latest
          - name: e2e-runner
            image: ghcr.io/underpass-ai/made-e2e-runner
            dockerfile: ./tests/e2e/runner.Dockerfile
            cache_key: runner
            floating_tag: e2e-latest
          - name: stub-runtime
            image: ghcr.io/underpass-ai/made-e2e-stub-runtime
            dockerfile: ./tests/e2e/stub-runtime.Dockerfile
            cache_key: stub-runtime
            floating_tag: e2e-latest
          - name: stub-llm
            image: ghcr.io/underpass-ai/made-e2e-stub-llm
            dockerfile: ./tests/e2e/stub-llm.Dockerfile
            cache_key: stub-llm
            floating_tag: e2e-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ matrix.floating_tag }},enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=compose-smoke-${{ matrix.cache_key }}-${{ runner.arch }}-v1
          cache-to: type=gha,mode=max,scope=compose-smoke-${{ matrix.cache_key }}-${{ runner.arch }}-v1

  promote-release-image:
    name: promote-release-image (${{ matrix.name }})
    needs: [release-preflight, compose-smoke]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.release-preflight.result == 'success' && needs.compose-smoke.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: made
            image: ghcr.io/underpass-ai/made
          - name: e2e-runner
            image: ghcr.io/underpass-ai/made-e2e-runner
          - name: stub-runtime
            image: ghcr.io/underpass-ai/made-e2e-stub-runtime
          - name: stub-llm
            image: ghcr.io/underpass-ai/made-e2e-stub-llm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout verification code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Promote the verified commit digest without rebuilding
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          RELEASE_REF: ${{ needs.release-preflight.outputs.release_ref }}
        run: |
          source_tag="${IMAGE}:sha-${GITHUB_SHA:0:7}"
          target_tag="${IMAGE}:${RELEASE_REF}"
          bash scripts/ci/verify-commit-image.sh "${GITHUB_SHA}" "${source_tag}"

          # verify-commit-image just pulled this exact source and checked its
          # full revision label. Reuse that local RepoDigest so a later move of
          # the sha-* locator cannot change what is promoted.
          source_ref="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "${source_tag}")"
          source_digest="${source_ref##*@}"

          set +e
          target_probe="$(docker buildx imagetools inspect "${target_tag}" \
            --format '{{json .Manifest}}' 2>&1)"
          target_status=$?
          set -e
          if [[ ${target_status} -eq 0 ]]; then
            target_digest="$(python3 -c \
              'import json,sys; print(json.load(sys.stdin)["digest"])' \
              <<<"${target_probe}")"
            if [[ "${target_digest}" != "${source_digest}" ]]; then
              echo "error: immutable ${target_tag} already points at ${target_digest}" >&2
              echo "expected verified commit digest ${source_digest}" >&2
              exit 1
            fi
            echo "${target_tag} already promotes ${source_ref}"
          elif grep -Eqi 'not found|manifest unknown|404' <<<"${target_probe}"; then
            docker buildx imagetools create --tag "${target_tag}" "${source_ref}"
          else
            echo "${target_probe}" >&2
            echo "error: target registry probe failed; refusing to infer absence" >&2
            exit 1
          fi

          promoted_digest="$(docker buildx imagetools inspect "${target_tag}" \
            --format '{{json .Manifest}}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          if [[ "${promoted_digest}" != "${source_digest}" ]]; then
            echo "error: promoted digest ${promoted_digest} differs from ${source_digest}" >&2
            exit 1
          fi

  publish-helm-chart:
    needs: [release-preflight, compose-smoke, promote-release-image]
    # Chart versions are immutable release artifacts. Main and manual runs may
    # refresh development images, but only a release tag may claim SEMVER in OCI.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.release-preflight.result == 'success' && needs.compose-smoke.result == 'success' && needs.promote-release-image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Helm
        run: bash scripts/ci/install-helm.sh

      - name: Log in to GitHub Container Registry (OCI for charts)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package Helm chart
        run: |
          mkdir -p dist
          helm package "${CHART_PATH}" --destination dist

      - name: Refuse to overwrite a different chart version
        id: chart
        shell: bash
        env:
          VERSION: ${{ needs.release-preflight.outputs.version }}
        run: |
          set +e
          probe="$(helm show chart "${CHART_REGISTRY}/${CHART_NAME}" \
            --version "${VERSION}" 2>&1)"
          status=$?
          set -e
          if [[ ${status} -eq 0 ]]; then
            mkdir -p dist/existing dist/local-tree dist/remote-tree
            helm pull "${CHART_REGISTRY}/${CHART_NAME}" \
              --version "${VERSION}" --destination dist/existing
            tar -xzf "dist/${CHART_NAME}-${VERSION}.tgz" -C dist/local-tree
            tar -xzf "dist/existing/${CHART_NAME}-${VERSION}.tgz" -C dist/remote-tree
            if ! diff -ru dist/local-tree dist/remote-tree; then
              echo "error: immutable chart ${CHART_NAME}:${VERSION} has different content" >&2
              exit 1
            fi
            echo "push=false" >> "${GITHUB_OUTPUT}"
          elif grep -Eqi 'not found|manifest unknown|404' <<<"${probe}"; then
            echo "push=true" >> "${GITHUB_OUTPUT}"
          else
            echo "${probe}" >&2
            echo "error: registry probe failed; refusing to infer absence" >&2
            exit 1
          fi

      - name: Push new Helm chart
        if: steps.chart.outputs.push == 'true'
        run: |
          for archive in dist/*.tgz; do
            helm push "${archive}" "${CHART_REGISTRY}"
          done

  # crates.io publish for every public crate, in dependency order.
  # `made-mcp` carries the embedded engine, so the whole chain beneath it
  # — core, api, proto, app, adapters, embedded — has to exist on the
  # registry or cargo refuses the upload. The script owns the order, skips
  # versions already published so a half-finished release can be resumed
  # by re-running this job, and waits out the new-crate rate limit instead
  # of failing the release over it. Tag-only on purpose: `workflow_dispatch`
  # re-rolls are not allowed to mutate the registry.
  publish-crates:
    needs: [release-preflight, compose-smoke]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.release-preflight.result == 'success' && needs.compose-smoke.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          shared-key: publish-crate

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          bash scripts/ci/publish-crates.sh --self-test
          bash scripts/ci/publish-crates.sh
