[package]
name = "made-mcp"
version.workspace = true
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["Tirso Garcia Ibañez"]
repository = "https://github.com/underpass-ai/made"
description = "Stdio MCP (Model Context Protocol) adapter that exposes the MADE gRPC API to coding agents (Codex, Claude Desktop, …)."
keywords = ["mcp", "anthropic", "made", "stdio"]
categories = ["command-line-utilities"]
publish = true
readme = "README.md"
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE*",
]

[lints]
workspace = true

[[bin]]
name = "made-mcp"
path = "src/main.rs"

[dependencies]
made-adapters = { workspace = true, optional = true }
made-app = { workspace = true, optional = true }
made-core = { workspace = true, optional = true }
made-embedded = { workspace = true, optional = true }
made-mcp-proto = { workspace = true, optional = true }
async-trait = { workspace = true }
futures = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_yaml = { workspace = true, optional = true }
sha2 = { workspace = true }
time = { workspace = true, optional = true }
tokio = { workspace = true }
tonic = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
uuid = { workspace = true, optional = true }
testcontainers = { version = "0.28", optional = true }

[features]
# The embedded engine ships by default: `cargo install made-mcp` is the
# documented way to run a ceremony with no service behind it, and a binary
# that cannot honour MADE_MCP_BACKEND=embedded makes that instruction a lie.
# A cluster deployment uses the container image, not cargo install.
default = ["embedded", "grpc"]

embedded = [
    "dep:made-adapters",
    "dep:made-app",
    "dep:made-core",
    "dep:made-embedded",
    "dep:serde",
    "dep:serde_yaml",
    "dep:time",
    "dep:uuid",
]
grpc = [
    "dep:made-mcp-proto",
    "dep:futures",
    "dep:prost-types",
    "dep:time",
    "dep:tonic",
    "dep:uuid",
]
container-tests = ["dep:testcontainers"]

[dev-dependencies]
# The gRPC server's own `DomainError` -> `Status` mapping, so the test
# next to `From<DomainError> for ToolError` can compare the two arms by
# composing them rather than by keeping a second list. A dev-dependency
# on purpose: `cargo tree -e normal` never sees it, so the embedded
# binary's dependency boundary is untouched.
made-adapters = { workspace = true, features = ["grpc"] }
tempfile = "3"
tokio = { workspace = true, features = ["full", "test-util"] }
