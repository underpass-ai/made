[package]
name = "made-tests-integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Integration tests for MADE adapters, backed by testcontainers-managed services. Not shipped."
publish = false

[lints]
workspace = true

[features]
# Opt-in: CI enables this feature to actually run the tests. Without
# the feature the crate compiles but exercises nothing, so `cargo
# test --workspace` stays fast and network-free.
container-tests = ["dep:testcontainers"]

[dependencies]
made-core = { workspace = true }
made-app = { workspace = true }
made-adapters = { workspace = true, features = [
    "grpc",
    "nats",
    "postgres",
    "runtime-grpc",
    # The canonical embedded store. The parity session drives its second
    # pass over it, because SQLite is what the local edition ships with
    # and an in-memory store is not what ADR-014 promises about.
    "sqlite",
] }
made-proto = { workspace = true }
# Tokio is always required for the in-process gRPC fixture; the
# postgres_fixture additionally needs testcontainers when the
# `container-tests` feature is on.
tokio = { workspace = true }
async-trait = { workspace = true }
async-nats = { workspace = true }
tonic = { workspace = true }
tokio-stream = { workspace = true }
testcontainers = { version = "0.28", optional = true }
# Used by `tls_fixture` to mint in-memory CA + server + client
# certificates for the TLS handshake integration tests. Lives in
# `[dependencies]` (not dev-dependencies) because `tls_fixture` is
# a `pub mod` re-used by `tests/` files and `publish = false` on
# this crate keeps it out of the production dep graph anyway.
# Default features include the `crypto` provider (ring-backed),
# which is what `KeyPair::generate()` needs.
rcgen = { version = "0.13", features = ["pem"] }
# The parity support types under `src/` are ports implemented for both
# engines at once: a frozen clock, a deterministic step handler and an
# evidence source. They need the time and JSON crates the ports speak,
# so those are ordinary dependencies of this test-only crate rather
# than dev-dependencies of its `tests/`.
time = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
made-client = { workspace = true }
# Both backends at once, on purpose: the parity test is the only place
# that can compare what one MCP tool answers depending on how it
# reached the engine.
made-mcp = { workspace = true, features = ["grpc", "embedded"] }
made-embedded = { workspace = true }
async-nats = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
prost-types = { workspace = true }
testcontainers = "0.28"
# The migration test drives `made-mcp migrate-store` over a copy of the
# committed v0.3.1 store: the fixture is evidence, so every run works
# on its own copy in a directory that goes away with the test.
tempfile = "3"
sha2 = { workspace = true }
sqlx = { workspace = true }
