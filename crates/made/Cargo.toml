[package]
name = "made"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "MADE binary: wires adapters and runs the gRPC + event-driven service."
# Shipped as a container image, not a crate. The crates.io name `made` belongs
# to an unrelated project, so an accidental publish would fail anyway.
publish = false

[lints]
workspace = true

[lib]
name = "made"
path = "src/lib.rs"

[[bin]]
name = "made"
path = "src/main.rs"

[features]
# OpenTelemetry OTLP exporter. Turn on with `-F otel` at build time.
# At runtime the exporter only activates when `MADE_OTLP_ENDPOINT`
# is set; otherwise the binary behaves exactly as without the
# feature — JSON-format spans to stdout only. This keeps the
# default container image free of the OTel dependency surface for
# deployments that do not need it.
otel = [
    "made-adapters/otel",
]

[dependencies]
made-core = { workspace = true }
made-app = { workspace = true }
made-adapters = { workspace = true, features = [
    "grpc",
    "nats",
    "postgres",
    "sqlite",
    "runtime-grpc",
] }
made-proto = { workspace = true }

async-nats = { workspace = true }
async-trait = { workspace = true }
axum = "0.7"
thiserror = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
figment = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.13", features = ["pem"] }
sha2 = { workspace = true }
tower = { version = "0.4", features = ["util"] }
tokio-stream = { workspace = true }
