# Deployment profile for the `underpass-runtime` namespace on the
# main cluster. Mirrors the sibling pattern used by
# `rehydration-kernel` and `underpass-runtime` (one `values-<ns>.yaml`
# per target environment).
#
# Apply with:
#
#   NAMESPACE=underpass-runtime \
#   RELEASE_NAME=MADE \
#   VALUES_FILE=charts/made/values.underpass-runtime.yaml \
#   IMAGE_TAG=sha-COMMIT \
#   ./scripts/ci/deploy-kubernetes.sh

image:
  # Image tag is supplied at deploy time by the script (via
  # `--set image.tag=sha-COMMIT`); see `scripts/ci/deploy-kubernetes.sh`.
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull

authorization:
  policyId: made-underpass-runtime-policy
  principals:
    existingSecret: made-underpass-runtime-auth-principals

ceremonySearch:
  storeId: made-underpass-runtime
  cursorHmacKeyFromSecret:
    name: made-underpass-runtime-cursor-hmac
    key: key

# Each Underpass plane owns its own NATS bus — KMP, runtime, and
# MADE publish on disjoint subject namespaces and there is no
# cross-plane subscription, so collocating them would only couple
# deployments without sharing data. The chart-managed embedded NATS
# keeps the deploy self-contained.
messaging:
  nats:
    enabled: true
    # Empty `url` + `embedded.enabled: true` resolves at template time
    # to `nats://<release>-nats:4222`.
    url: ""
    publishPrefix: made
    triggerSubject: made.trigger.>
    embedded:
      enabled: true
      jetstream:
        enabled: false

# Production posture: hand winning proposals to the real
# `underpass-runtime` service in this namespace. The runtime presents
# a server cert signed by `rehydration-kernel-internal-issuer` and
# expects client authentication (mTLS mutual). MADE
# carries its own client cert minted from the same issuer (see
# `tests/cluster/made-runtime-client-cert.yaml`).
executor:
  kind: runtime
  runtime:
    endpoint: https://underpass-runtime:50053
    principal:
      tenantId: underpass
      actorId: made
      roles: orchestrator
    tls:
      mode: mutual
      domainName: underpass-runtime
      existingSecret: made-runtime-client-tls

# Seed a single `triage` council with a NoopAgent so the deployment
# is exercisable from the get-go via gRPC. Real specialists land
# through the API.
config:
  seedSpecialties: triage
  logLevel: info

# Provider + scoring configuration for the in-namespace vLLM (gemma).
# Captured here so `helm upgrade` reproduces the working pod instead of
# depending on imperative `kubectl set env` drift. The endpoint/model are
# the in-cluster gemma Service (not secrets), so they live in plain
# values; a bearer token, if ever needed, belongs in a Secret wired via
# `providerEnvFrom`.
providerEnv:
  - name: MADE_VLLM_ENDPOINT
    value: "http://underpass-llm-gemma-4-31b-structured:8000"
  - name: MADE_VLLM_MODEL
    value: "google/gemma-4-31B-it"
  - name: MADE_VLLM_MAX_TOKENS
    value: "512"
  - name: MADE_VLLM_TIMEOUT_SECS
    value: "300"
  # LLM-as-judge scoring (PR #89): ranks deliberation proposals by quality
  # instead of uniform pass-fraction. It reuses the vLLM endpoint/model
  # above and fails fast when they are absent, which is why both blocks
  # are kept together — never enable the judge without the vLLM config.
  - name: MADE_JUDGE_ENABLED
    value: "true"
  - name: MADE_JUDGE_THRESHOLD
    value: "0.5"
  # OpenTelemetry trace export over mutual TLS (the image ships the `otel`
  # feature; dormant until the endpoint is set). A deliberation/ceremony
  # then shows up as a distributed trace — including the per-proposal and
  # judge-verdict span events. The in-namespace OTLP collector requires a
  # client cert (`client_ca_file`), per the Underpass mTLS posture, so the
  # export presents the same client identity the Runtime executor uses
  # (mounted at /etc/made/runtime-tls). The collector's server
  # cert SAN is `underpass-runtime`, not its Service name, hence the SNI
  # override.
  - name: MADE_OTLP_ENDPOINT
    value: "https://underpass-runtime-otel-collector:4317"
  - name: MADE_OTLP_TLS_CA_PATH
    value: "/etc/made/runtime-tls/ca.crt"
  - name: MADE_OTLP_TLS_CERT_PATH
    value: "/etc/made/runtime-tls/tls.crt"
  - name: MADE_OTLP_TLS_KEY_PATH
    value: "/etc/made/runtime-tls/tls.key"
  - name: MADE_OTLP_TLS_DOMAIN_NAME
    value: "underpass-runtime"

# Authorization and the application stores share the cluster Postgres pool.
# The DSN is supplied by an existing Secret and never rendered as a literal.
persistence:
  postgres:
    enabled: true
    urlFromSecret:
      name: made-postgres-dsn
      key: url

# Public gRPC still authenticates the caller even when a mesh also protects the
# cluster edge. The Secret is managed outside this chart.
tls:
  mode: mutual
  existingSecret: made-underpass-runtime-grpc-mtls

# Shared Postgres, policy and cursor keys permit rolling replacement across
# three replicas.
replicaCount: 3

pdb:
  enabled: true

# Allow `sha-SHORT` image tags from CI — they are immutable per
# commit, but the chart's default refuses any non-digest reference
# unless this development knob opts in.
development:
  allowMutableImageTags: true
