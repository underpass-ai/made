# Minimal standalone install profile.
#
# This profile has no NATS, Postgres or Runtime executor. It still requires the
# mandatory prebootstrapped authorization policy and operator-managed mTLS,
# principal-map and cursor-key Secrets used by every public deployment.

authorization:
  policyId: made-minimal-policy
  principals:
    existingSecret: made-minimal-auth-principals

ceremonySearch:
  storeId: made-minimal
  cursorHmacKeyFromSecret:
    name: made-minimal-cursor-hmac
    key: key

config:
  # Seed one NoopAgent + one single-agent council so a fresh install
  # can answer RunCouncilDecision immediately.
  seedSpecialties: triage

messaging:
  nats:
    enabled: false
    embedded:
      enabled: false

executor:
  kind: noop

persistence:
  ceremonies:
    enabled: true
  postgres:
    enabled: false

tls:
  mode: mutual
  existingSecret: made-minimal-grpc-mtls

pdb:
  enabled: false

networkPolicy:
  enabled: false
