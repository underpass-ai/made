# Standalone persistent install profile.
#
# This profile keeps the MADE independent from Runtime and
# provider credentials, but persists deliberations, councils, agents,
# and statistics through a Postgres DSN read from a Kubernetes secret.
# Output contracts are still registered/seeded separately.

replicaCount: 3

config:
  seedSpecialties: triage

authorization:
  policyId: made-postgres-policy
  principals:
    existingSecret: made-postgres-auth-principals

ceremonySearch:
  storeId: made-postgres
  cursorHmacKeyFromSecret:
    name: made-postgres-cursor-hmac
    key: key

messaging:
  nats:
    enabled: true
    url: ""
    publishPrefix: made
    triggerSubject: made.trigger.>
    embedded:
      enabled: true
      jetstream:
        enabled: false

executor:
  kind: noop

persistence:
  postgres:
    enabled: true
    url: ""
    urlFromSecret:
      name: made-postgres-dsn
      key: url

tls:
  mode: mutual
  existingSecret: made-postgres-grpc-mtls

pdb:
  enabled: true

networkPolicy:
  enabled: false
