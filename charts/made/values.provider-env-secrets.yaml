# Overlay profile for provider adapter environment sourced from a
# Kubernetes Secret.
#
# Use together with an install profile such as values.embedded-nats.yaml:
#
#   helm upgrade --install MADE charts/made \
#     -f charts/made/values.embedded-nats.yaml \
#     -f charts/made/values.provider-env-secrets.yaml \
#     --set image.digest=sha256:REPLACE_ME
#
# The referenced Secret should expose MADE_* keys such as:
#   MADE_OPENAI_API_KEY
#   MADE_OPENAI_MODEL
#   MADE_OPENAI_ENDPOINT
#   MADE_OPENAI_MAX_TOKENS
#   MADE_VLLM_MODEL
#   MADE_VLLM_ENDPOINT
#   MADE_VLLM_BEARER_TOKEN
#   MADE_VLLM_MAX_TOKENS
#   MADE_VLLM_TIMEOUT_SECS
#   MADE_ANTHROPIC_API_KEY
#   MADE_ANTHROPIC_MODEL
#   MADE_ANTHROPIC_ENDPOINT
#   MADE_ANTHROPIC_MAX_TOKENS

providerEnvFrom:
  - secretRef:
      name: made-provider-env
