# Standalone install profile with a release-local NATS bus.
#
# Use this when MADE should publish/consume its event
# surface but you do not want to provision an external NATS first.
# Runtime, Postgres and provider secrets stay off. Public access still uses
# operator-managed mTLS and a prebootstrapped policy.

authorization:
  policyId: made-embedded-nats-policy
  principals:
    existingSecret: made-embedded-nats-auth-principals

ceremonySearch:
  storeId: made-embedded-nats
  cursorHmacKeyFromSecret:
    name: made-embedded-nats-cursor-hmac
    key: key

config:
  # Seed one NoopAgent + one single-agent council so a fresh install
  # can answer RunCouncilDecision immediately.
  seedSpecialties: triage

messaging:
  nats:
    enabled: true
    # Empty URL + embedded.enabled=true resolves to
    # nats://<release-fullname>-nats:4222 at template time.
    url: ""
    publishPrefix: made
    triggerSubject: made.trigger.>
    embedded:
      enabled: true
      jetstream:
        # Core NATS is enough for MADE's current fire-and-
        # forget event surface.
        enabled: false
      monitoring:
        enabled: false

executor:
  kind: noop

persistence:
  ceremonies:
    enabled: true
  postgres:
    enabled: false

tls:
  mode: mutual
  existingSecret: made-embedded-nats-grpc-mtls

pdb:
  enabled: false

networkPolicy:
  enabled: false
