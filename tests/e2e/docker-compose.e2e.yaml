# End-to-end stack for the Choreographer.
#
# Brings up:
#   - nats:2 (trigger bus + outbound event bus)
#   - choreographer (built from the root Dockerfile, seeded with one
#     `triage` council + one NoopAgent so the runner can exercise the
#     gRPC surface without extra wiring)
#   - e2e-runner  (drives scenarios via the public gRPC contract and
#     exits 0 on success)
#
# `scripts/ci/e2e-compose.sh` uses `--abort-on-container-exit
# --exit-code-from e2e-runner`, so whatever the runner returns is
# the job's result.

services:
  nats:
    image: nats:2
    command: ["-js"]
    # No healthcheck: the upstream nats:2 image is distroless-ish and
    # ships no shell, wget, nc, or curl, so any compose-level probe
    # would be brittle. The choreographer retries its NATS connection
    # on startup (see `compose::wire_messaging`), which is the real
    # invariant we care about.

  # Canned-response stub of underpass.runtime.v1 — gives the
  # choreographer's `RuntimeExecutor` a real gRPC peer to talk to so
  # the stack E2E can exercise the full Orchestrate path
  # (Deliberate -> winner -> RuntimeExecutor::execute) without pulling
  # the real underpass-runtime image into this repo.
  stub-runtime:
    build:
      context: ../..
      dockerfile: tests/e2e/stub-runtime.Dockerfile
    environment:
      STUB_RUNTIME_GRPC_ADDR: "0.0.0.0:50053"
      RUST_LOG: "info"

  # OpenAI-shaped stub LLM. Always returns a JSON Report payload that
  # satisfies `api/examples/output-contracts/report.schema.json`,
  # giving the choreographer's `OpenAiAgent` adapter a deterministic
  # peer so scenario 8 can prove the positive structured-output path
  # end-to-end without a real provider in the test path.
  stub-llm:
    build:
      context: ../..
      dockerfile: tests/e2e/stub-llm.Dockerfile
    environment:
      STUB_LLM_LISTEN: "0.0.0.0:8000"
      RUST_LOG: "info"

  choreographer:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      CHOREO_GRPC_PORT: "50055"
      CHOREO_NATS_ENABLED: "true"
      CHOREO_NATS_URL: "nats://nats:4222"
      CHOREO_PUBLISH_PREFIX: "choreo"
      CHOREO_TRIGGER_SUBJECT: "choreo.trigger.>"
      CHOREO_SEED_SPECIALTIES: "triage"
      CHOREO_EXECUTOR_KIND: "runtime"
      CHOREO_RUNTIME_GRPC_ENDPOINT: "http://stub-runtime:50053"
      # Required for `DispatchingAgentFactory::from_env` to enable the
      # `openai` kind so scenario 8 can register an OpenAI-backed agent
      # dynamically. The stub-llm sidecar ignores the bearer token, so
      # any non-empty value works — keep this dummy-typed and obvious
      # to operators reading compose logs.
      CHOREO_OPENAI_API_KEY: "stub-key-not-used"
      RUST_LOG: "info"
    depends_on:
      - nats
      - stub-runtime
      - stub-llm

  e2e-runner:
    build:
      context: ../..
      dockerfile: tests/e2e/runner.Dockerfile
    environment:
      CHOREOGRAPHER_ENDPOINT: "http://choreographer:50055"
      CHOREO_SEED_SPECIALTY: "triage"
      # Pinned to the path that runner.Dockerfile copies into the
      # image. Scenario 8 reads the canonical Report schema from
      # here; failing back to an env-overridable path keeps the
      # runner robust against operators who run the binary outside
      # the container.
      CHOREO_REPORT_SCHEMA_PATH: "/etc/choreo/report.schema.json"
      RUST_LOG: "info"
    depends_on:
      - choreographer
