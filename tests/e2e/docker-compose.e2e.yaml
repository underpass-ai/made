# End-to-end stack for MADE.
#
# Brings up:
#   - nats:2 (trigger bus + outbound event bus)
#   - MADE (built from the root Dockerfile, seeded with one
#     `triage` council + one NoopAgent so the runner can exercise the
#     gRPC surface without extra wiring)
#   - e2e-runner  (drives scenarios via the public gRPC contract and
#     exits 0 on success)
#
# `scripts/ci/e2e-compose.sh` uses `--abort-on-container-exit
# --exit-code-from e2e-runner`, so whatever the runner returns is
# the job's result.

services:
  nats:
    image: nats:2
    command: ["-js"]
    # No healthcheck: the upstream nats:2 image is distroless-ish and
    # ships no shell, wget, nc, or curl, so any compose-level probe
    # would be brittle. MADE retries its NATS connection
    # on startup (see `compose::wire_messaging`), which is the real
    # invariant we care about.

  # Canned-response stub of underpass.runtime.v1 — gives the
  # MADE's `RuntimeExecutor` a real gRPC peer to talk to so
  # the stack E2E can exercise the full Orchestrate path
  # (Deliberate -> winner -> RuntimeExecutor::execute) without pulling
  # the real underpass-runtime image into this repo.
  stub-runtime:
    build:
      context: ../..
      dockerfile: tests/e2e/stub-runtime.Dockerfile
    environment:
      STUB_RUNTIME_GRPC_ADDR: "0.0.0.0:50053"
      RUST_LOG: "info"

  # OpenAI-shaped stub LLM. Always returns a JSON Report payload that
  # satisfies `api/examples/output-contracts/report.schema.json`,
  # giving MADE's `OpenAiAgent` adapter a deterministic
  # peer so scenario 8 can prove the positive structured-output path
  # end-to-end without a real provider in the test path.
  stub-llm:
    build:
      context: ../..
      dockerfile: tests/e2e/stub-llm.Dockerfile
    environment:
      STUB_LLM_LISTEN: "0.0.0.0:8000"
      RUST_LOG: "info"

  made:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      MADE_GRPC_PORT: "50055"
      MADE_NATS_ENABLED: "true"
      MADE_NATS_URL: "nats://nats:4222"
      MADE_PUBLISH_PREFIX: "made"
      MADE_TRIGGER_SUBJECT: "made.trigger.>"
      MADE_SEED_SPECIALTIES: "triage"
      MADE_EXECUTOR_KIND: "runtime"
      MADE_RUNTIME_GRPC_ENDPOINT: "http://stub-runtime:50053"
      # Required for `DispatchingAgentFactory::from_env` to enable the
      # `openai` kind so scenario 8 can register an OpenAI-backed agent
      # dynamically. The stub-llm sidecar ignores the bearer token, so
      # any non-empty value works — keep this dummy-typed and obvious
      # to operators reading compose logs.
      MADE_OPENAI_API_KEY: "stub-key-not-used"
      # Activates the `vllm` kind in the agent factory so scenario 9
      # can register a vLLM-backed agent against the same stub-llm
      # sidecar (both adapters speak `POST /v1/chat/completions`). The
      # factory needs both env vars present at boot before it accepts
      # the kind; per-descriptor `provider.endpoint` and
      # `provider.model` override at register time.
      MADE_VLLM_MODEL: "stub-report-vllm-v1"
      MADE_VLLM_ENDPOINT: "http://stub-llm:8000"
      RUST_LOG: "info"
    depends_on:
      - nats
      - stub-runtime
      - stub-llm

  e2e-runner:
    build:
      context: ../..
      dockerfile: tests/e2e/runner.Dockerfile
    environment:
      MADE_ENDPOINT: "http://made:50055"
      MADE_SEED_SPECIALTY: "triage"
      # Full 1-9 suite by default. Override from the host with, e.g.,
      # `MADE_E2E_SCENARIOS=cluster-connectivity make e2e-compose`.
      MADE_E2E_SCENARIOS: "${MADE_E2E_SCENARIOS:-compose}"
      # Pinned to the path that runner.Dockerfile copies into the
      # image. Scenario 8 reads the canonical Report schema from
      # here; failing back to an env-overridable path keeps the
      # runner robust against operators who run the binary outside
      # the container.
      MADE_REPORT_SCHEMA_PATH: "/etc/made/report.schema.json"
      # Allows opt-in `MADE_E2E_SCENARIOS=ceremony-vllm make
      # e2e-compose` to render the vLLM-backed ceremony against the
      # deterministic stub-llm sidecar.
      MADE_VLLM_MODEL: "stub-report-vllm-v1"
      MADE_VLLM_ENDPOINT: "http://stub-llm:8000"
      MADE_VLLM_MAX_TOKENS: "512"
      MADE_VLLM_TIMEOUT_SECS: "30"
      RUST_LOG: "info"
    depends_on:
      - made
