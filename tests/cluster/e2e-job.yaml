# Runs the `made-e2e-runner` binary as a Kubernetes Job against a
# MADE deployed in-cluster. Useful as a smoke test after a
# `helm upgrade --install`: scenarios 1-4 are driven through real DNS,
# real network, and the cluster's NATS connection.
#
# Caveats:
#
# - Scenarios 1-4 cover gRPC + NATS + causal metadata against the
#   real deploy. They pass when MADE is wired correctly
#   to its own NATS bus.
#
# - Scenarios 5-9 are fixture-shaped and stay opt-in: scenario 5
#   expects a Runtime tool named `stub.echo`, and scenarios 8-9 expect
#   the `stub-llm` OpenAI-compatible sidecar. Run `runtime-stub`,
#   `structured-output`, or `compose` only in clusters that provide
#   equivalent fixtures or real matching services.
#
# Apply after `helm upgrade --install`. The Job's TTL cleans the
# resource after 10 min.

apiVersion: batch/v1
kind: Job
metadata:
  name: made-e2e
  namespace: underpass-runtime
  labels:
    app.kubernetes.io/part-of: underpass
    app.kubernetes.io/component: e2e
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: underpass
        app.kubernetes.io/component: e2e
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: e2e-runner
          # Pin to the same commit as the MADE image; both
          # come from the same workspace and rolling them together
          # avoids API skew between client and server.
          image: ghcr.io/underpass-ai/made-e2e-runner:sha-23b3af0
          imagePullPolicy: IfNotPresent
          env:
            - name: MADE_ENDPOINT
              value: "http://made:50055"
            - name: MADE_NATS_URL
              value: "nats://made-nats:4222"
            - name: MADE_SEED_SPECIALTY
              value: "triage"
            - name: MADE_E2E_SCENARIOS
              value: "cluster-connectivity"
            - name: RUST_LOG
              value: "info"
